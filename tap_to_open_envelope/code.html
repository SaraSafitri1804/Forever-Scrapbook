  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface antialiased">
  <div class="min-h-[1024px] w-full bg-light-surface flex flex-col justify-between" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Top Cream Band -->
    <div class="w-full h-16 bg-light-surface"></div>

    <!-- Center Deep Navy Envelope Stage -->
    <main class="w-full flex-1 bg-light-primary-container px-gutter-lg py-section flex flex-col items-center justify-center relative">
      <div class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-center gap-gutter-xl">

        <!-- Sealed Navy Envelope -->
        <div class="w-full max-w-md aspect-[4/3] bg-light-primary rounded-md border-2 border-light-secondary-container shadow-2xl relative flex flex-col items-center justify-center overflow-hidden p-gutter-lg">
          <!-- Envelope Flap Triangle Effect via Borders -->
          <div class="w-full border-b border-light-secondary-container/40 pb-gutter-xl mb-gutter-sm flex flex-col items-center justify-center">
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-primary-container uppercase tracking-widest mb-gutter-md">UNTUKMU</span>
          </div>

          <!-- Silver Wax Seal Centerpiece -->
          <button id="wax-seal-btn" type="button" aria-label="Tap wax seal to open letter" class="w-16 h-16 rounded-full bg-light-secondary-container text-light-on-secondary-container border-4 border-light-surface-container-lowest shadow-lg flex items-center justify-center hover:scale-110 active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-on-primary">
            <span class="material-symbols-outlined text-headline-md" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">favorite</span>
          </button>

          <p id="envelope-status" data-design-text-token="body-md" class="font-body text-body-md text-light-on-primary-container mt-gutter-md text-center hidden" role="status">
            Membuka segel surat cintamu...
          </p>
        </div>

        <!-- Stacked Hearts on Right -->
        <div class="flex md:flex-col items-center gap-gutter-md" aria-hidden="true">
          <span class="material-symbols-outlined text-display-md text-light-secondary-container" style="font-variation-settings: &#39;FILL&#39; 1;">favorite</span>
          <span class="material-symbols-outlined text-display-md text-light-secondary-container" style="font-variation-settings: &#39;FILL&#39; 1;">favorite</span>
        </div>

      </div>
    </main>

    <!-- Bottom Cream Band with TAP TO OPEN Pill -->
    <footer class="w-full bg-light-surface px-gutter-lg py-gutter-lg flex justify-end max-w-5xl mx-auto">
      <!-- COMPONENT: button-secondary -->
      <button id="tap-open-btn" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="inline-flex items-center justify-center px-gutter-xl py-gutter-xs rounded-full bg-light-surface-container-lowest text-light-primary border border-dashed border-light-primary-container shadow-sm hover:bg-light-secondary-container active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary">
        <span data-design-text-token="label-lg" class="font-body text-label-lg uppercase">KETUK UNTUK MEMBUKA</span>
      </button>
    </footer>
  </div>

  <script>
    (function () {
      var sealBtn = document.getElementById('wax-seal-btn');
      var tapBtn = document.getElementById('tap-open-btn');
      var status = document.getElementById('envelope-status');
      function openEnvelope() {
        if (status) {
          status.classList.remove('hidden');
        }
        window.location.href = '../my_letter_for_you/code.html';
      }
      if (sealBtn) sealBtn.addEventListener('click', openEnvelope);
      if (tapBtn) tapBtn.addEventListener('click', openEnvelope);
    })();
  </script>
