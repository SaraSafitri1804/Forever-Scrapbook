<body class="bg-light-surface text-light-on-surface antialiased">
  <div class="min-h-[1024px] w-full bg-light-surface flex flex-col justify-between" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Top Navy Band & Header -->
    <header class="w-full bg-light-primary-container px-gutter-lg py-gutter-md flex items-center justify-between">
      <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-primary-container uppercase">KETUK SALAH SATU STIKER</span>
      <span class="material-symbols-outlined text-title-lg text-light-on-primary-container" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">auto_awesome</span>
    </header>

    <!-- Main Surprise Stickers Stage -->
    <main class="w-full max-w-5xl mx-auto px-gutter-lg py-section flex flex-col items-center gap-gutter-xl relative">
      <!-- Top Row: SURPRISE Title + Party Cat Sticker -->
      <div class="w-full flex items-center justify-center relative">
        <h1 data-design-text-token="display-md" class="font-display text-display-md-mobile md:text-display-md text-light-primary uppercase tracking-widest text-center">
          KEJUTAN MANIS
        </h1>

        <div class="hidden sm:block w-24 h-24 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-xs shadow-md rotate-6 absolute right-0 -top-4 overflow-hidden">
          <img src="../assets/stickers/kucing_pesta.png" id="sticker-party_cat" alt="Stiker Kucing Pesta" class="w-full h-full object-contain rounded-sm">
        </div>
      </div>

      <!-- Four Interactive Sticker Items -->
      <div class="w-full grid grid-cols-2 md:grid-cols-4 gap-gutter-lg items-stretch">
        <!-- Sticker 1: Camera -->
        <button type="button" data-sticker="camera" class="sticker-btn bg-light-surface-container-lowest rounded-xl border-2 border-light-outline-variant p-gutter-md shadow-md hover:border-light-primary-container hover:-rotate-2 active:scale-95 transition-transform duration-state-change ease-state-change flex flex-col items-center justify-between gap-gutter-sm">
          <img src="../assets/stickers/kamera.png" id="sticker-camera" alt="Stiker Kamera" class="w-32 h-32 object-contain">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-primary uppercase">KENANGAN</span>
        </button>

        <!-- Sticker 2: Bouquet -->
        <button type="button" data-sticker="bouquet" class="sticker-btn bg-light-surface-container-lowest rounded-xl border-2 border-light-outline-variant p-gutter-md shadow-md hover:border-light-primary-container hover:rotate-2 active:scale-95 transition-transform duration-state-change ease-state-change flex flex-col items-center justify-between gap-gutter-sm">
          <img src="../assets/stickers/buket_bunga.png" id="sticker-bouquet" alt="Stiker Buket Bunga" class="w-32 h-32 object-contain">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-primary uppercase">BUNGA</span>
        </button>

        <!-- Sticker 3: Cake -->
        <button type="button" data-sticker="cake" class="sticker-btn bg-light-surface-container-lowest rounded-xl border-2 border-light-outline-variant p-gutter-md shadow-md hover:border-light-primary-container hover:-rotate-2 active:scale-95 transition-transform duration-state-change ease-state-change flex flex-col items-center justify-between gap-gutter-sm">
          <img src="../assets/stickers/kue.png" id="sticker-cake" alt="Stiker Kue" class="w-32 h-32 object-contain">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-primary uppercase">HARAPAN</span>
        </button>

        <!-- Sticker 4: Gift Box -->
        <button type="button" data-sticker="gift" class="sticker-btn bg-light-surface-container-lowest rounded-xl border-2 border-light-outline-variant p-gutter-md shadow-md hover:border-light-primary-container hover:rotate-2 active:scale-95 transition-transform duration-state-change ease-state-change flex flex-col items-center justify-between gap-gutter-sm">
          <img src="../assets/stickers/kado.png" id="sticker-gift" alt="Stiker Hadiah" class="w-32 h-32 object-contain">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-primary uppercase">HADIAH</span>
        </button>
      </div>

      <!-- Interactive Sticker Message -->
      <div class="px-gutter-lg py-gutter-sm rounded-full bg-light-secondary-container text-light-on-secondary-container border border-light-primary-container shadow-sm text-center">
        <span id="sticker-message" data-design-text-token="body-md" class="font-body text-body-md">
          Pilih salah satu stiker di atas untuk membaca pesan manis!
        </span>
      </div>

      <!-- Bottom Navigation Row -->
      <div class="w-full flex items-center justify-between pt-gutter-sm">
        <!-- COMPONENT: button-secondary -->
        <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" onclick="window.location.href=&#39;../first_picture/code.html&#39;" class="inline-flex items-center justify-center px-gutter-xl py-gutter-xs rounded-full bg-light-surface-container-lowest text-light-primary border border-dashed border-light-primary-container shadow-sm hover:bg-light-secondary-container active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary">
          <span data-design-text-token="label-lg" class="font-body text-label-lg uppercase">KEMBALI</span>
        </button>

        <!-- COMPONENT: button-primary -->
        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" onclick="window.location.href=&#39;../surprise_music_hub/code.html&#39;" class="inline-flex items-center justify-center px-gutter-xl py-gutter-xs rounded-full bg-light-primary-container text-light-on-primary border-2 border-dashed border-light-on-primary-container shadow-sm hover:bg-light-primary active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary">
          <span data-design-text-token="label-lg" class="font-body text-label-lg uppercase">LANJUT</span>
        </button>
      </div>
    </main>

    <!-- Bottom Navy Band -->
    <div class="w-full h-10 bg-light-primary-container"></div>
  </div>

  <script>
    (function () {
      var notes = {
        camera: 'Mengabadikan setiap senyuman manis yang kita lalui bersama tahun ini.',
        bouquet: 'Mawar virtual yang takkan pernah layu — selamat ulang tahun, sayangku!',
        cake: 'Tiup lilin dan buat permohonan — semoga semua impian indahmu terkabul di hari ulang tahun ini!',
        gift: 'Sebuah kejutan istimewa sudah menunggumu di halaman berikutnya!'
      };
      var msg = document.getElementById('sticker-message');
      document.querySelectorAll('.sticker-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-sticker');
          if (msg && notes[key]) {
            msg.textContent = notes[key];
          }
        });
      });
    })();
  </script>
