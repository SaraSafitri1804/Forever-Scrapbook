<body class="bg-light-surface text-light-on-surface antialiased">
  <div class="min-h-[1024px] w-full bg-light-surface flex flex-col items-center justify-center p-gutter-lg md:p-section relative" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Gingham Keepsake Window -->

        <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-secondary-container uppercase">KOTAK KEJUTAN</span>
        <span class="material-symbols-outlined text-title-lg text-light-on-secondary-container" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">favorite</span>

        </h1>

          <!-- Box 1 -->
          <div role="button" tabindex="0" data-box="1" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="box-card p-gutter-lg rounded-md bg-light-surface-container-lowest border-2 border-light-primary-container shadow-md hover:bg-light-secondary-container transition-colors duration-state-change ease-state-change flex flex-col items-center justify-center gap-gutter-md text-center cursor-pointer">
            <div class="w-16 h-16 rounded-lg bg-light-secondary-container flex items-center justify-center text-light-primary">
              <span class="material-symbols-outlined text-display-md" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">vpn_key</span>
            </div>
            <span data-design-text-token="label-lg" class="font-body text-label-lg text-light-primary uppercase">KOTAK 01</span>
          </div>

          <!-- Box 2 -->
          <div role="button" tabindex="0" data-box="2" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="box-card p-gutter-lg rounded-md bg-light-surface-container-lowest border-2 border-light-primary-container shadow-md hover:bg-light-secondary-container transition-colors duration-state-change ease-state-change flex flex-col items-center justify-center gap-gutter-md text-center cursor-pointer">

            </div>
            <span data-design-text-token="label-lg" class="font-body text-label-lg text-light-primary uppercase">KOTAK 02</span>
          </div>

          <!-- Box 3 -->
          <div role="button" tabindex="0" data-box="3" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="box-card p-gutter-lg rounded-md bg-light-surface-container-lowest border-2 border-light-primary-container shadow-md hover:bg-light-secondary-container transition-colors duration-state-change ease-state-change flex flex-col items-center justify-center gap-gutter-md text-center cursor-pointer">

            </div>
            <span data-design-text-token="label-lg" class="font-body text-label-lg text-light-primary uppercase">KOTAK 03</span>
          </div>
        </div>

        <!-- Prompt / Reveal Pill -->
        <div class="px-gutter-lg py-gutter-sm rounded-full bg-light-surface-container-lowest border border-dashed border-light-primary-container shadow-sm text-center">
          <span id="box-reveal" data-design-text-token="body-md" class="font-body text-body-md text-light-primary">
            KLIK SETIAP KOTAK UNTUK MEMBUKA HADIAH
          </span>
        </div>
      </section>
    </main>

    <!-- Bottom Right BACK Pill -->
    <footer class="w-full max-w-4xl flex justify-end mt-gutter-lg">

        <span data-design-text-token="label-lg" class="font-body text-label-lg uppercase">KEMBALI</span>
      </button>
    </footer>
  </div>

  <script>
    (function () {
      var messages = {
        '1': 'Kotak 01: Kencan ngopi & kue manis di akhir pekan — aku yang traktir!',
        '2': 'Kotak 02: Album foto polaroid kenangan perjalanan terbaik kita berdua.',
        '3': 'Kotak 03: Tiket rahasia — 100 pelukan hangat yang bisa kamu klaim kapan saja!'
      };
      var reveal = document.getElementById('box-reveal');
      var cards = document.querySelectorAll('.box-card');
      cards.forEach(function (card) {
        function handleOpen() {
          var id = card.getAttribute('data-box');
          if (reveal && messages[id]) {
            reveal.textContent = messages[id];
          }
        }
        card.addEventListener('click', handleOpen);
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleOpen();
          }
        });
      });
    })();
  </script>
