  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface antialiased">
  <div class="min-h-[1024px] w-full bg-light-surface flex flex-col items-center justify-center p-gutter-lg md:p-section relative overflow-hidden" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Decorative Navy Corner Accent -->
    <div class="hidden md:flex items-center justify-center w-20 h-20 rounded-full bg-light-primary-container text-light-on-primary shadow-md absolute top-10 left-12 -rotate-12" aria-hidden="true">
      <span class="material-symbols-outlined text-display-md" style="font-variation-settings: &#39;FILL&#39; 1;">favorite</span>
    </div>

    <!-- Sky-Blue Scrapbook Window -->
    <main class="w-full max-w-4xl bg-light-secondary-container rounded-xl border-2 border-light-primary-container shadow-xl overflow-hidden relative z-10">
      <!-- Top "forever" Header Bar -->
      <header class="bg-light-surface-container-lowest px-gutter-lg py-gutter-sm border-b-2 border-light-primary-container flex items-center justify-between">
        <span class="material-symbols-outlined text-title-lg text-light-primary" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">auto_awesome</span>
        <span data-design-text-token="display-md" class="font-display italic text-display-md-mobile md:text-display-md text-light-primary leading-none">selamanya</span>
        <span class="material-symbols-outlined text-title-lg text-light-primary" aria-hidden="true">close</span>
      </header>

      <!-- Window Body -->
      <section class="p-gutter-lg md:p-gutter-xl flex flex-col items-center gap-gutter-xl relative">
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg-mobile md:text-headline-lg text-light-on-secondary-container uppercase tracking-widest text-center">FOTO PERTAMA KITA</h1>

        <!-- Three Tilted Polaroid Frames -->
<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-gutter-lg items-center justify-items-center py-gutter-sm">
          <!-- Polaroid 1 -->
          <article class="w-60 bg-light-surface-container-lowest p-gutter-sm rounded-sm border border-light-outline-variant shadow-lg -rotate-3 transition-transform duration-state-change ease-state-change hover:rotate-0">
            <img id="photo-day_one" src="../assets/photos/day_one.jpg" alt="Hari Pertama" class="w-full h-48 object-cover rounded-sm">
            <div class="pt-gutter-sm flex items-center justify-between">
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">HARI PERTAMA KITA</span>
              <span class="material-symbols-outlined text-body-md text-light-primary" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">favorite</span>
            </div>
          </article>

          <!-- Polaroid 2 -->
          <article class="w-60 bg-light-surface-container-lowest p-gutter-sm rounded-sm border border-light-outline-variant shadow-lg rotate-2 transition-transform duration-state-change ease-state-change hover:rotate-0">
            <img id="photo-first_coffee" src="../assets/photos/first_coffee.jpg" alt="Belajar Matematika Bareng" class="w-full h-48 object-cover rounded-sm">
            <div class="pt-gutter-sm flex items-center justify-between">
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">BELAJAR MATEMATIKA BARENG</span>
              <span class="material-symbols-outlined text-body-md text-light-primary" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">favorite</span>
            </div>
          </article>

          <!-- Polaroid 3 -->
          <article class="w-60 bg-light-surface-container-lowest p-gutter-sm rounded-sm border border-light-outline-variant shadow-lg -rotate-2 transition-transform duration-state-change ease-state-change hover:rotate-0">
            <img id="photo-golden_hour" src="../assets/photos/golden_hour.jpg" alt="Jalan Santai Berdua" class="w-full h-48 object-cover rounded-sm">
            <div class="pt-gutter-sm flex items-center justify-between">
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">JALAN SANTAI BERDUA</span>
              <span class="material-symbols-outlined text-body-md text-light-primary" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">favorite</span>
            </div>
          </article>
        </div>

        <!-- Bottom Row: Rose Sticker & NEXT Pill -->
        <div class="w-full flex items-center justify-between gap-gutter-md pt-gutter-sm">
          <div class="w-20 h-20 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-xs shadow-md -rotate-6 overflow-hidden">
            <img src="../assets/stickers/bunga_mawar.png" id="sticker-rose_fp" alt="Stiker Bunga Mawar" class="w-full h-full object-contain rounded-sm">
          </div>

          <!-- COMPONENT: button-secondary -->
          <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" onclick="window.location.href=&#39;../surprise_stickers/code.html&#39;" class="inline-flex items-center justify-center px-gutter-xl py-gutter-xs rounded-full bg-light-surface-container-lowest text-light-primary border border-dashed border-light-primary-container shadow-sm hover:bg-light-primary-container hover:text-light-on-primary active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary">
            <span data-design-text-token="label-lg" class="font-body text-label-lg uppercase">LANJUT</span>
          </button>
        </div>
      </section>
    </main>
  </div>
