<body class="bg-light-primary-container text-light-on-surface antialiased">
  <div class="min-h-[1024px] w-full bg-light-primary-container flex flex-col items-center justify-center p-gutter-lg md:p-section relative overflow-hidden" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Decorative Scrapbook Stickers -->
    <div class="hidden md:flex items-center justify-center w-14 h-14 rounded-full bg-light-secondary-container text-light-on-secondary-container border-2 border-light-surface-container-lowest shadow-md absolute top-12 left-16 -rotate-12" aria-hidden="true">
      <span class="material-symbols-outlined text-headline-md" style="font-variation-settings: &#39;FILL&#39; 1;">favorite</span>
    </div>
    <div class="hidden md:flex items-center justify-center w-14 h-14 rounded-full bg-light-secondary-container text-light-on-secondary-container border-2 border-light-surface-container-lowest shadow-md absolute top-20 right-16 rotate-12" aria-hidden="true">
      <span class="material-symbols-outlined text-headline-md" style="font-variation-settings: &#39;FILL&#39; 1;">star</span>
    </div>
    <div class="hidden md:flex items-center justify-center w-12 h-12 rounded-full bg-light-surface-container-lowest text-light-primary border-2 border-light-secondary-container shadow-md absolute bottom-16 right-24 -rotate-6" aria-hidden="true">
      <span class="material-symbols-outlined text-title-lg" style="font-variation-settings: &#39;FILL&#39; 1;">auto_awesome</span>
    </div>

    <!-- Retro Browser Window -->
    <main class="w-full max-w-4xl bg-light-surface-container-lowest rounded-lg border-2 border-light-primary shadow-xl overflow-hidden relative z-10">
      <!-- Window Tab & Title Bar -->
      <header class="bg-light-secondary-container px-gutter-md py-gutter-sm border-b-2 border-light-primary flex items-center justify-between gap-gutter-md">
        <div class="flex items-center gap-gutter-sm">
          <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Back" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-light-surface-container-lowest text-light-primary border border-light-primary-container hover:bg-light-surface-variant transition-colors duration-state-change ease-state-change">
            <span class="material-symbols-outlined text-body-lg" aria-hidden="true">arrow_back</span>
          </button>
          <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Forward" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-light-surface-container-lowest text-light-primary border border-light-primary-container hover:bg-light-surface-variant transition-colors duration-state-change ease-state-change">
            <span class="material-symbols-outlined text-body-lg" aria-hidden="true">arrow_forward</span>
          </button>
        </div>

        <!-- URL Address Pill -->
        <div class="flex-1 max-w-md bg-light-surface-container-lowest rounded-full border border-light-primary-container px-gutter-md py-gutter-xs flex items-center gap-gutter-sm">
          <span class="material-symbols-outlined text-body-md text-light-primary" aria-hidden="true">search</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant truncate">https://kenangan-kita.forever</span>
        </div>

        <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Close window" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-light-surface-container-lowest text-light-primary border border-light-primary-container hover:bg-light-surface-variant transition-colors duration-state-change ease-state-change">
          <span class="material-symbols-outlined text-body-lg" aria-hidden="true">close</span>
        </button>
      </header>

      <!-- Window Content Stage -->
      <section class="bg-light-surface px-gutter-lg py-section md:px-section flex flex-col items-center text-center gap-gutter-lg relative">
        <!-- Floating Mini Hearts -->
        <div class="w-full flex items-center justify-between px-gutter-md md:px-section" aria-hidden="true">
          <span class="material-symbols-outlined text-title-lg text-light-primary-container -rotate-12" style="font-variation-settings: &#39;FILL&#39; 1;">favorite</span>
          <span class="material-symbols-outlined text-title-lg text-light-secondary rotate-12" style="font-variation-settings: &#39;FILL&#39; 1;">favorite</span>
        </div>

        <!-- Layered Romantic Title -->
        <div class="flex flex-col items-center gap-gutter-xs">
          <span data-design-text-token="display-md" class="font-display italic text-display-md-mobile md:text-display-md text-light-primary leading-none">Selamat</span>
          <h1 data-component-id="typography-display" data-component-type="typography" data-component-variant="display" data-design-text-token="display-lg" class="font-display text-display-lg-mobile md:text-display-lg text-light-primary-container uppercase tracking-widest text-balance">ULANG TAHUN</h1>
        </div>

        <!-- Chibi Couple Centerpiece + Rose Sticker -->
<div class="relative flex items-center justify-center my-gutter-sm">
          <div class="w-56 h-56 md:w-64 md:h-64 rounded-xl bg-light-surface-container-lowest border-2 border-light-secondary-container p-gutter-sm shadow-md flex items-center justify-center overflow-hidden">
            <img id="photo-cover" src="../assets/photos/cover.jpg" alt="Foto Kenangan Kita" class="w-full h-full object-contain rounded-lg">
          </div>
          <div class="hidden sm:block w-24 h-24 rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-xs shadow-md rotate-12 absolute -right-14 -bottom-4 overflow-hidden">
            <img src="../assets/stickers/bunga_mawar.png" id="sticker-rose_cover" alt="Stiker Bunga Mawar" class="w-full h-full object-contain rounded-sm">
          </div>
        </div>

        <!-- Prompt & Primary CTA -->
        <div class="flex flex-col items-center gap-gutter-md mt-gutter-sm">
          <p data-component-id="typography-body" data-component-type="typography" data-component-variant="body" data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface uppercase tracking-wider">TAP &#39;START&#39; TO OPEN MY SURPRISE</p>

          <!-- COMPONENT: button-primary -->
          <button id="start-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="inline-flex items-center justify-center px-gutter-xl py-gutter-sm rounded-full bg-light-primary-container text-light-on-primary border-2 border-dashed border-light-on-primary-container shadow-md hover:bg-light-primary active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary">
            <span data-design-text-token="label-lg" class="font-body text-label-lg uppercase">MULAI</span>
          </button>

          <p id="start-feedback" class="font-body text-body-md text-light-primary hidden" role="status">
            <span data-design-text-token="body-md">Membuka kenangan manis kita...</span>
          </p>
        </div>
      </section>
    </main>

    <!-- Subtle Bottom Caption -->
    <footer class="mt-gutter-lg text-center">
      <p data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-primary-container">HADIAH SPESIAL ULANG TAHUN</p>
    </footer>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('start-btn');
      var feedback = document.getElementById('start-feedback');
      if (btn && feedback) {
        btn.addEventListener('click', function () {
          feedback.classList.remove('hidden');
          if (window.parent && window.parent !== window) { try { window.parent.postMessage({ type: 'UNLOCK_AUDIO' }, '*'); } catch(e){} }
          window.location.href = '../first_picture/code.html';
        });
      }
    })();
  </script>
